<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BloodBridge</title>
  <meta name="description" content="BloodBridge helps verified care teams find and coordinate eligible blood donors quickly.">
  <meta name="theme-color" content="#a61936">
  <script>
    (() => {
      const saved = localStorage.getItem('bb-theme') || 'system';
      const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
